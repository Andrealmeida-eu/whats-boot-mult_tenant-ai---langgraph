
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: whatsapp_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    environment:
      - REDIS_ARGS=--appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  bot:
    build: .
    container_name: bot
    restart: always
    env_file:
      - .env 
    # ✅ Comando corrigido - ajuste conforme seu projeto
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data
      - .:/app
      - ./langgraph.json:/app/langgraph.json

  # ==================== LANGGRAPH AGENT SERVER (essencial para Studio) ====================
  agent-server:
    build: .
    container_name: agent-server
    restart: always
    env_file:          
      - .env
    command: langgraph dev --host 0.0.0.0 --port 2024
    ports:
      - "2024:2024"
    depends_on:
      - bot
      - redis
    volumes:
      - .:/app
      - ./langgraph.json:/app/langgraph.json

  # Evolution API (mantido)
  evolution-api:
    profiles: ["evolution"]
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
  evolution_instances: