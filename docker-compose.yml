services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: whatsapp_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
      image: redis/redis-stack-server:latest
      container_name: redis
      # SUBSTITUÍMOS O 'COMMAND' PELA VARIÁVEL DE AMBIENTE:
      environment:
        - REDIS_ARGS=--appendonly yes
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data


  bot:
    build: .
    container_name: bot
    restart: always
    environment:
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}          
      LANGCHAIN_PROJECT: "lanchonete-whatsapp-bot"      
      LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"
      
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data

  # Optional: run Evolution API locally (you can also use an external Evolution)
  evolution-api:
    profiles: ["evolution"]
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
